name: Dev task / bug
description: Technical task or bug for the developers (references epics/stories/ADRs; assumes make test/smoke fluency).
title: "[dev]: "
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - feature
        - bug
        - refactor
        - chore
        - test
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen, technically.
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: References
      description: Related epic / story / ADR — e.g. `Story 3.2`, `AD-5`, `docs/ARCHITECTURE.md`.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (bugs only)
      description: Exact commands + expected vs actual. Say where each runs (host / which container / which user).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done (Given/When/Then welcome). Name the gate — e.g. `make test` / `make smoke` green.
    validations:
      required: true
