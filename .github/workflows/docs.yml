# Documentation gate. Offline rules only — GITHUB_TOKEN is repo-scoped and cannot read
# org facts (2FA, member list), so those rules run locally under your own gh auth.
# Why the checker is vendored at .github/repo-docs.py, and how it fails: repo-docs ADR-0004
# https://github.com/APS-Conecta/repo-docs/blob/main/docs/adr/0004-the-checker-is-vendored-into-every-repo.md
#
# No paths filter: the gate runs on every PR and every push to the default branch. A
# `Docs:` trailer or an English title is required of PRs that change code — the pr-gate
# subcommand reads the event payload; gitleaks scans the PR commit range, not history.
name: docs

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the PR range scan needs the base commit's ancestry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          # the tarball keeps its asset name: sha256sum --check matches checksums.txt's
          # entries by filename, and --ignore-missing would silently skip a renamed file
          cd /tmp && sha256sum --check --ignore-missing checksums.txt
          sudo tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: "PR gate (Docs: line, English title)"
        if: github.event_name == 'pull_request'
        env:
          REPO_DOCS_ORG: APS-Conecta
        run: python3 .github/repo-docs.py pr-gate
      - name: Check documentation
        env:
          REPO_DOCS_ORG: APS-Conecta
          # two-dot: git log A..B is one-sided (the PR's own commits); three-dot would
          # sweep base-side merges once main advances. Push scans the pushed commits
          # only — a full-source scan would fire on history the repos cannot rewrite.
          REPO_DOCS_PR_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.event.after) || '' }}
        run: python3 .github/repo-docs.py check . --offline
