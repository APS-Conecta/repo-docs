# The scheduled central sweep (org L8-02): the only drift detector that can see
# the whole org, on a schedule. In-repo docs.yml runs --offline because
# GITHUB_TOKEN cannot read org facts; this job carries the org's fine-grained
# PAT (the APS_BOT_PAT organization secret, selected for this repo — which must
# stay PUBLIC: on GitHub Free an organization secret reaches public repos only,
# and a same-name repository secret would silently shadow it), clones the
# census, and fails on NEW findings —
# canon drift, a stale stamp (--stamp-error raises it centrally, where canon/
# is present), or a repo that joined the suite without canonizing (the census
# tripwire, L8-01). The census = baseline keys ∪ OWN_APPS: 12-apps.sh is the
# suite's own registry, so a repo cannot ship without being in it.
name: sweep

on:
  schedule:
    - cron: "43 5 * * 1"   # weekly — the drift bar between engine refreshes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Clone the census, check every repo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The census and the onboarding tripwire
        env:
          # The census has PRIVATE repos (territorio, farmacia, epidemiologia): a
          # bare `git clone https://…` has no credential on a runner and died
          # with "could not read Username" on the first sweep (2026-09-25).
          # `gh repo clone` reads GH_TOKEN; APS_BOT_PAT is the org's fine-grained
          # PAT (Contents: read on the private census repos), visible to this
          # repo through the org secret's repository selection.
          GH_TOKEN: ${{ secrets.APS_BOT_PAT }}
        # Clones land under RUNNER_TEMP, outside this checkout: nested inside it,
        # check --all's walk found repo-docs itself holding the whole census, and
        # the sweep audited repo-docs (with every repo nested in it) on top of the
        # per-PR docs.yml gate that already covers it.
        run: python3 scripts/census.py run --root "${RUNNER_TEMP}/census"
      - name: Check every repo — new findings red, the stamp is an error here
        env:
          GH_TOKEN: ${{ secrets.APS_BOT_PAT }}
          REPO_DOCS_ROOT: ${{ runner.temp }}/census
        # `check --all` exits 1 on ANY open error finding — 41 sit open in AIO
        # alone, baselined and known — so the exit code cannot be this job's red
        # line: the sweep's contract (header above) is red on NEW findings and
        # stamp drift, and stamp drift surfaces as a NEW canon-stamp fingerprint.
        # The full log still prints; only the verdict is the grep.
        # The baseline marker guards against a checker crash reading as green.
        run: |
          python3 scripts/docs.py check --all --stamp-error 2>&1 | tee check.log
          grep -q '^== baseline' check.log || { echo "::error::checker did not finish (no baseline section)"; exit 1; }
          ! grep -qE '^      NEW' check.log
